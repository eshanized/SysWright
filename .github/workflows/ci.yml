name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Structural, specification and packaging checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out SysWright
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check out Agent Skills reference validator
        uses: actions/checkout@v4
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .tmp/agentskills

      - name: Install upstream skills-ref validator
        run: python -m pip install ./.tmp/agentskills/skills-ref

      - name: Validate local skill structure
        run: python scripts/validate-skills.py

      - name: Validate against upstream Agent Skills reference implementation
        run: python scripts/validate-skills.py --strict-spec

      - name: Check repository references
        run: python scripts/check-references.py

      - name: Run unit and integration tests
        run: python tests/run_all_tests.py

      - name: Build all distribution artifacts
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: python scripts/package-skills.py --target all --output "$RUNNER_TEMP/syswright-dist"

      - name: Verify archive reproducibility
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          python scripts/package-skills.py --target archive --output "$RUNNER_TEMP/repro-a"
          python scripts/package-skills.py --target archive --output "$RUNNER_TEMP/repro-b"
          sha256sum "$RUNNER_TEMP/repro-a/syswright-0.1.0.tar.gz" "$RUNNER_TEMP/repro-b/syswright-0.1.0.tar.gz"
          cmp "$RUNNER_TEMP/repro-a/syswright-0.1.0.tar.gz" "$RUNNER_TEMP/repro-b/syswright-0.1.0.tar.gz"
